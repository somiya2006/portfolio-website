<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Amazon | Checkout</title><link rel="stylesheet" href="style.css"></head><body><nav class="nav"><a href="index.html">🏠 Home</a><a href="cart.html">🛒 Cart</a><a href="orders.html">📦 Orders</a></nav><main class="page"><div class="checkout-layout"><section class="checkout-left panel"><h2>Delivery Address</h2><input id="name" placeholder="Full Name"><input id="mobile" placeholder="Mobile Number"><textarea id="address" placeholder="Full Address"></textarea><input id="city" placeholder="City"><input id="state" placeholder="State"><input id="pincode" placeholder="Pincode"><h2>Payment Method</h2><select id="payment"><option>Cash on Delivery</option><option>UPI</option><option>Debit Card</option><option>Credit Card</option></select></section><aside class="checkout-right"><h2>Order Summary</h2><h3 id="subtotal">Subtotal : ₹0</h3><h3>Delivery : ₹40</h3><h2 id="grandtotal">Total : ₹40</h2><button class="primary-btn" onclick="placeOrder()">Place Order</button></aside></div></main><script src="checkout.js"></script></body></html>
